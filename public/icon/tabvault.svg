<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#gradient)"/>
  <!-- Stacked layers representing tabs/sessions -->
  <g fill="white">
    <!-- Bottom layer -->
    <rect x="28" y="70" width="72" height="12" rx="3" opacity="0.4"/>
    <!-- Middle layer -->
    <rect x="24" y="54" width="80" height="12" rx="3" opacity="0.6"/>
    <!-- Top layer -->
    <rect x="20" y="38" width="88" height="12" rx="3" opacity="0.85"/>
    <!-- Lock/vault symbol on top -->
    <path d="M64 62 L64 72 M56 72 L72 72 M52 72 L52 84 L76 84 L76 72 L52 72 Z" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
